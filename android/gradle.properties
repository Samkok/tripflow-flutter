org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx2g
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
android.useAndroidX=true
# Jetifier disabled: all plugins are AndroidX-native, so the legacy
# support-lib rewrite is unnecessary. Keeping it on made the JetifyTransform
# worker (which runs with its own small default heap, NOT org.gradle.jvmargs)
# OOM with "Java heap space" while transforming Flutter's engine jars on CI.
android.enableJetifier=false
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false

# Java home is intentionally NOT pinned here: this file is committed, so a
# machine-specific path breaks every other machine (and CI, which only got
# away with it by rewriting this file). Gradle picks the JDK from
# JAVA_HOME / the toolchain instead — needs Java 17+.
#
# Uncomment and adjust ONLY for a local override, and don't commit it:
# macOS (homebrew):  org.gradle.java.home=/opt/homebrew/opt/openjdk@17
# macOS (installer): org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home
# Windows:           org.gradle.java.home=C:\\Program Files\\Java\\jdk-17
# Linux:             org.gradle.java.home=/usr/lib/jvm/java-17-openjdk
