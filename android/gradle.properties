org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx2g
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
android.useAndroidX=true
# Jetifier disabled: all plugins are AndroidX-native, so the legacy
# support-lib rewrite is unnecessary. Keeping it on made the JetifyTransform
# worker (which runs with its own small default heap, NOT org.gradle.jvmargs)
# OOM with "Java heap space" while transforming Flutter's engine jars on CI.
android.enableJetifier=false
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false

# Set Java home to Java 17 or 18 (update path to your actual Java installation)
# Windows example: org.gradle.java.home=C:\\Program Files\\Java\\jdk-17
# macOS example: org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home
# Linux example: org.gradle.java.home=/usr/lib/jvm/java-17-openjdk
org.gradle.java.home=/opt/homebrew/opt/openjdk@17
