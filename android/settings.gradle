pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null : "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // 8.13.2 = latest stable AGP 8.x. Flutter stable (what CI resolves)
    // requires >= 8.11.1; the extra headroom avoids another forced bump the
    // next time that floor rises. Deliberately NOT AGP 9.x: it reads only
    // the new DSL, which breaks the Flutter Gradle plugin until Flutter
    // supports it (the "android.newDsl" fix box in the CI log).
    // Needs Gradle >= 8.13 — the wrapper is on 8.14.3.
    id "com.android.application" version "8.13.2" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

include ":app"
