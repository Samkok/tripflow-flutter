name: voyza
description: A mobile app for optimizing trip routes with Google Maps integration
publish_to: 'none'
version: 1.0.5+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  flutter_compass: ^0.8.0
  
  # Google Services
  google_places_flutter: ^2.0.0
  
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  cached_network_image: ^3.3.1
  
  # Navigation
  go_router: ^12.1.3
  
  # Local Storage
  shared_preferences: ^2.5.4
  
  # Environment
  flutter_dotenv: ^5.1.0
  
  # Utils
  uuid: ^4.5.2
  intl: ^0.19.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  csv: ^6.0.0
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^2.9.1+1
  supabase_flutter: ^2.10.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  crypto: ^3.0.7
  purchases_flutter: ^9.10.3
  purchases_ui_flutter: ^9.10.3
  google_maps_url_extractor: ^2.0.1
  in_app_review: ^2.0.10
  device_info_plus: ^12.4.0

  # Push Notifications (Firebase Cloud Messaging)
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^18.0.0

  # Performance monitoring — auto-traces cold start, slow frames, and
  # frozen frames so we can quantify the ANR reduction release-over-release.
  # Shares the existing Firebase project, no new auth/DSN needed.
  firebase_performance: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/images/
    - assets/map_styles/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"