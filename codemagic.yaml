workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      flutter: stable

    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Build app bundle
        script: flutter build appbundle

    artifacts:
      - build/**/outputs/**/*.aab

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
