workflows:
  android-release:
    name: Android Release
    environment:
      flutter: stable
      android_signing:
        - voyza_key
    scripts:
      - name: Create .env file
        script: |
          echo "REVENUECAT_API_KEY=$REVENUECAT_API_KEY" >> .env
          echo "REVENUECAT_WEBHOOK_AUTH_KEY=$REVENUECAT_WEBHOOK_AUTH_KEY" >> .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          echo "GOOGLE_DIRECTIONS_API_KEY=$GOOGLE_DIRECTIONS_API_KEY" >> .env
          echo "GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY" >> .env
          echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" >> .env
      - name: Install dependencies
        script: |
          flutter pub get

      - name: Update app.gradle with incremented version
        script: |
          set -e

          GRADLE_FILE="android/app/build.gradle"

          # Read current versionCode
          CURRENT_VERSION_CODE=$(grep versionCode $GRADLE_FILE | awk '{print $2}')
          NEW_VERSION_CODE=$((CURRENT_VERSION_CODE + 1))

          # Read current versionName
          CURRENT_VERSION_NAME=$(grep versionName $GRADLE_FILE | sed 's/.*"\(.*\)".*/\1/')

          # Increment patch version (x.y.Z)
          BASE_VERSION=$(echo "$CURRENT_VERSION_NAME" | cut -d. -f1,2)
          PATCH_VERSION=$(echo "$CURRENT_VERSION_NAME" | cut -d. -f3)
          NEW_PATCH_VERSION=$((PATCH_VERSION + 1))
          NEW_VERSION_NAME="$BASE_VERSION.$NEW_PATCH_VERSION"

          echo "Old versionCode: $CURRENT_VERSION_CODE"
          echo "New versionCode: $NEW_VERSION_CODE"
          echo "Old versionName: $CURRENT_VERSION_NAME"
          echo "New versionName: $NEW_VERSION_NAME"

          # Update build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode $NEW_VERSION_CODE/" $GRADLE_FILE
          sed -i "s/versionName \".*\"/versionName \"$NEW_VERSION_NAME\"/" $GRADLE_FILE

          # Release notes
          echo "[{\"language\": \"en-US\", \"text\": \"Release version $NEW_VERSION_NAME (build $NEW_VERSION_CODE)\"}]" > release_notes.json
          cat release_notes.json

      - name: Build Android AAB
        script: |
          flutter build appbundle
    artifacts:
      - build/**/outputs/**/*.aab
