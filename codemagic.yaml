workflows:
  android-release:
    name: Android Release
    environment:
      flutter: stable
      android_signing:
        - voyza_key
    scripts:
      - name: Create .env file
        script: |
          echo "REVENUECAT_API_KEY_ANDROID=$REVENUECAT_API_KEY_ANDROID" >> .env
          echo "REVENUECAT_API_KEY_IOS=$REVENUECAT_API_KEY_IOS" >> .env
          echo "REVENUECAT_WEBHOOK_AUTH_KEY=$REVENUECAT_WEBHOOK_AUTH_KEY" >> .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          echo "GOOGLE_DIRECTIONS_API_KEY=$GOOGLE_DIRECTIONS_API_KEY" >> .env
          echo "GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY" >> .env
          echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" >> .env
      - name: Install dependencies
        script: |
          flutter pub get

      - name: Build Android AAB
        script: |
          flutter build appbundle --release --build-number=$BUILD_NUMBER

    artifacts:
      - build/**/outputs/**/*.aab

  ios-release:
    name: Build iOS App
    integrations:
      app_store_connect: VoyZa
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.superiordev.voyza
      vars:
        APP_STORE_APPLE_ID: 6758559163
      flutter: stable
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Update app.gradle with version info
        script: |
          APP_BUILD_NUMBER=$(($BUILD_NUMBER))
          APP_VERSION="1.0.$(($BUILD_NUMBER))"
          echo "Updating app.gradle with APP_VERSION: $APP_VERSION and APP_BUILD_NUMBER: $APP_BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_BUILD_NUMBER" "ios/Runner/Info.plist"
          echo "[{\"language\": \"en-US\", \"text\": \"Build type: production, Version: $APP_VERSION, Build number: $APP_BUILD_NUMBER\"}]" > release_notes.json
          cat release_notes.json
      - name: Build iOS App
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
      cancel_previous_builds: true
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users
      email:
        recipients:
          - hengsamkok76@gmail.com