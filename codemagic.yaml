workflows:
  android-release:
    name: Android Release
    environment:
      groups:
        - supabase
        - google_map
        - revenuecat
      flutter: stable
      android_signing:
        - voyza_key
    scripts:
      - name: Create .env file
        script: |
          echo "" > .env
          echo "REVENUECAT_API_KEY_ANDROID=$REVENUECAT_API_KEY_ANDROID" >> .env
          echo "REVENUECAT_API_KEY_IOS=$REVENUECAT_API_KEY_IOS" >> .env
          echo "REVENUECAT_WEBHOOK_AUTH_KEY=$REVENUECAT_WEBHOOK_AUTH_KEY" >> .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          echo "GOOGLE_DIRECTIONS_API_KEY=$GOOGLE_DIRECTIONS_API_KEY" >> .env
          echo "GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY" >> .env
          echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" >> .env
      - name: Install dependencies
        script: |
          flutter pub get

      - name: Build Android AAB
        script: |
          flutter build appbundle --release --build-number=$BUILD_NUMBER

    artifacts:
      - build/**/outputs/**/*.aab

  ios-release:
    name: Build iOS App
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: CodeMagicKey
    environment:
      groups:
        - supabase
        - google_map
        - revenuecat
        - app_store_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.superiordev.voyza
      vars:
        APP_STORE_APPLE_ID: 6758559163
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create .env file
        script: |
          echo "" > .env
          echo "REVENUECAT_API_KEY_ANDROID=$REVENUECAT_API_KEY_ANDROID" >> .env
          echo "REVENUECAT_API_KEY_IOS=$REVENUECAT_API_KEY_IOS" >> .env
          echo "REVENUECAT_WEBHOOK_AUTH_KEY=$REVENUECAT_WEBHOOK_AUTH_KEY" >> .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          echo "GOOGLE_DIRECTIONS_API_KEY=$GOOGLE_DIRECTIONS_API_KEY" >> .env
          echo "GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY" >> .env
          echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" >> .env

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Update version info
        script: |
          APP_BUILD_NUMBER=$(($BUILD_NUMBER))
          APP_VERSION="1.0.$(($BUILD_NUMBER))"
          echo "Updating Info.plist with APP_VERSION: $APP_VERSION and APP_BUILD_NUMBER: $APP_BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_BUILD_NUMBER" "ios/Runner/Info.plist"

      - name: Build iOS App
        script: flutter build ipa --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/ios/ipa/*.ipa
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
      cancel_previous_builds: true
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users
      email:
        recipients:
          - hengsamkok76@gmail.com
          